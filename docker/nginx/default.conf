# Fronts the "genesis" app container. Mounted by docker-compose.yml, which also
# resolves the `app` hostname over the compose network.

upstream genesis_app {
    server app:3000;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Carries the port too, so the origin the app rebuilds matches what the
    # browser sent — the CSRF check on form POSTs compares them.
    proxy_set_header X-Forwarded-Host  $http_host;

    location / {
        proxy_pass http://genesis_app;
    }
}
