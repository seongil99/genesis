# Routes http://localhost:8080 to the "genesis" SvelteKit dev server running on
# the host (`bun run dev --host 0.0.0.0 --port 5173`). Mounted into the nginx
# container by docker-compose.yml.

# Pass websocket upgrades through for Vite HMR.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream genesis_dev {
    # host-gateway alias declared in docker-compose.yml; on Docker Desktop the
    # name resolves to the host even without it.
    server host.docker.internal:5173;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Vite streams module updates; buffering and short timeouts break HMR.
    proxy_buffering     off;
    proxy_read_timeout  1d;
    proxy_send_timeout  1d;

    location / {
        proxy_pass http://genesis_dev;
    }
}
