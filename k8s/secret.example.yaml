# Template only, NOT listed in kustomization.yaml: real values never go in Git.
# Create the Secret by hand instead:
#
#   kubectl -n genesis create secret generic genesis-env \
#     --from-literal=BIRTHDAY_PASSWORD='...' \
#     --from-literal=AUTH_SECRET="$(openssl rand -hex 32)"
#
# Changing either value invalidates every existing session (see CLAUDE.md).
apiVersion: v1
kind: Secret
metadata:
  name: genesis-env
  namespace: genesis
type: Opaque
stringData:
  BIRTHDAY_PASSWORD: change-me
  AUTH_SECRET: change-me-to-a-long-random-string
