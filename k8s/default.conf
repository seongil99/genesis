# Fronts the "genesis" app. Mounted from the nginx-conf ConfigMap that
# kustomization.yaml generates from this file; `app` resolves to the app Service.
# Keep in sync with docker/nginx/default.conf, which docker-compose.yml mounts.

# Keep the scheme an outer proxy already reported (TLS terminates there, so this
# hop only ever sees http); fall back to our own when reached directly.
map $http_x_forwarded_proto $genesis_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream genesis_app {
    server app:3000;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $genesis_proto;
    # Carries the port too, so the origin the app rebuilds matches what the
    # browser sent — the CSRF check on form POSTs compares them.
    proxy_set_header X-Forwarded-Host  $http_host;

    location / {
        proxy_pass http://genesis_app;
    }
}
